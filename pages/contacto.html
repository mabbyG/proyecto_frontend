<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/contacto.css">
</head>

<body>

    <header>

        <nav class="nav_hero">
            <div class="container nav-container">
                <div class="logo_name">
                    <h2>Mabby Design<span class="punto">.</span></h2>
                </div>
                <ul class="links">

                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="./contacto.html" class="active">Contacto</a></li>
                </ul>

            </div>
        </nav>


    </header>
    <main>
        <!-- SECCIÓN CONTACTO -->
        <section class="contacto">
            <div class="contacto-wrapper">

                <!-- Bloque de textos que se ubicará a la izquierda -->
                <div class="hero_textos">
                    <h1 class="titulo">Contactanos <br><span class="titulo_activo">Hacemos realidad tu idea.</span></h1>
                    <p class="copia">Creamos de cero tu pagina o mejoramos la que tengas. <br><span
                            class="copia_activa">Contanos tu proyecto</span></p>
                </div>

                <!-- Bloque del formulario que se ubicará a la derecha -->
                <div class="container-formulario">
                    <form action="https://formspree.io" method="POST" enctype="multipart/form-data">

                        <!-- Campo: Nombre -->
                        <label>
                            Nombre:
                            <input type="text" name="nombre" placeholder="Escribe tu nombre aquí" required>
                        </label>

                        <!-- Campo: Apellido -->
                        <label>
                            Apellido:
                            <input type="text" name="apellido" placeholder="Escribe tu apellido aquí" required>
                        </label>

                        <!-- Campo: Correo Electrónico -->
                        <label>
                            Tu correo electrónico:
                            <input type="email" name="email" placeholder="ejemplo@roblox.com" required>
                        </label>

                        <!-- Campo: Subir Imagen -->
                        <label>
                            Sube una imagen (pagina actual o ideas):
                            <input type="file" name="imagen_mascota" accept="image/*" required>
                        </label>

                        <!-- Campo: Mensaje -->
                        <label>
                            Tu mensaje:
                            <textarea name="message"
                                placeholder="Cuéntanos qué necesitas o reporta un problema..."
                                required></textarea>
                        </label>

                        <!-- Botón de Envío -->
                        <button type="submit" class="cta">Enviar Formulario</button>
                    </form>
                </div>

            </div>
        </section>

    </main>
    <footer class="container_footer">

        <!-- Contenido del footer -->



        <div class="redes_sociales">
            <span> Nuestras Redes Sociales</span>
            <div class="rrss_iconos">
                <a href="https://facebook.com" target="_blank" class="social_link">
                    <img src="../assets/facebook-brands-solid-full.svg" alt="Facebook" width="20" height="20">
                </a>
                <a href="https://instagram.com" target="_blank" class="social_link">
                    <img src="../assets/instagram-brands-solid-full.svg" alt="Instagram" width="20" height="20">
                </a>
                <a href="https://behance.com" target="_blank" class="social_link">
                    <img src="../assets/behance-brands-solid-full.svg" alt="Facebook" width="20" height="20">
                </a>
                <a href="https://github.com/mabbyG" target="_blank" class="social_link">
                    <img src="../assets/github-brands-solid-full.svg" alt="Instagram" width="20" height="20">
                </a>
            </div>
        </div>




        <div class="container_telefonos">
            <span>Llamanos</span>
            <div class="numeros_tel">
                <img src="../assets/phone-solid-full.svg" alt="telefono" width="20" height="20"> (011)4205-4560
                <img src="../assets/square-whatsapp-brands-solid-full.svg" alt="whapsapp" width="20"
                    height="20">(011)3600-6292

            </div>
        </div>

        <div class="container_ubicacion">
            <img src="../assets/location-dot-solid-full.svg" alt="ubicacion" width="20" height="20"><span>
                Ubicación</span>
            <p>B1825BRF, Anatole France 2116, B1825BRF, Provincia de Buenos Aires</p>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3279.8280000856357!2d-58.39287802514034!3d-34.70951796309184!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bccd23354b9703%3A0xda73e97489ad606d!2sBRF%2C%20Anatole%20France%202116%2C%20B1825%20Lan%C3%BAs%2C%20Provincia%20de%20Buenos%20Aires!5e0!3m2!1ses!2sar!4v1792031459603!5m2!1ses!2sar"
                width="200" height="150" style="border-radius:5px;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </footer>
</body>
